services:
  - type: worker
    name: telegram-music-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: starter
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME
        value: music_bot
      - key: ADMIN_IDS
        sync: false
      - key: CHANNEL_ID
        sync: false
      # ---- Voice-chat streaming (optional) ----
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: SESSION
        sync: false
      - key: DURATION_LIMIT
        value: "60"
      - key: QUEUE_LIMIT
        value: "20"
      - key: VIDEO_PLAY
        value: "True"
      # ---- Optional ----
      - key: COOKIES_FILE
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
